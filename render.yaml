# Render Blueprint for the UEMP web client: a static site.
# Deploy: Render dashboard → New → Blueprint → select this repository.
#
# /api/* is proxied to the API service, so the browser sees one origin. The session cookie
# can then stay SameSite=Lax and HttpOnly, with no cross-site cookie configuration.
services:
  - type: web
    name: uemp-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22
    routes:
      - type: rewrite
        source: /api/*
        destination: https://uemp-api.onrender.com/api/* # the API service's URL
      - type: rewrite
        source: /*
        destination: /index.html # client-side routing
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
